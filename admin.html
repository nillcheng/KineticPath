<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KineticPath | 後台管理</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@700;900&family=Noto+Sans+TC:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0a;
    --bg2: #111111;
    --bg3: #181818;
    --border: rgba(255,255,255,0.08);
    --text: #e8e8e8;
    --text-dim: #888;
    --text-muted: #444;
    --accent: #c8a96e;
    --white: #ffffff;
    --danger: #c05050;
    --success: #5a9a52;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Noto Sans TC', sans-serif; background: var(--bg); color: var(--text); }

  /* ===== LOGIN ===== */
  #login-screen {
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    background:
      linear-gradient(to bottom, rgba(10,10,10,0.95), rgba(10,10,10,0.98)),
      url('https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?w=1200&q=60') center/cover;
  }

  .login-box {
    width: 380px;
    text-align: center;
    animation: fadeUp 0.5s ease both;
  }

  .login-logo {
    font-family: 'Noto Serif TC', serif;
    font-size: 2rem;
    font-weight: 900;
    color: var(--white);
    letter-spacing: 0.15em;
    margin-bottom: 0.3rem;
  }

  .login-logo em { color: var(--accent); font-style: normal; }

  .login-sub {
    color: var(--text-muted);
    font-size: 0.75rem;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    margin-bottom: 3rem;
  }

  .login-input {
    width: 100%; padding: 1rem 1.2rem;
    background: var(--bg2);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: 'Noto Sans TC', sans-serif;
    font-size: 0.95rem;
    margin-bottom: 1rem;
    outline: none;
    text-align: center;
    letter-spacing: 0.15em;
    transition: border-color 0.3s;
  }

  .login-input:focus { border-color: var(--accent); }

  .login-btn {
    width: 100%; padding: 1rem;
    background: var(--accent);
    color: var(--bg);
    border: none; cursor: pointer;
    font-family: 'Noto Sans TC', sans-serif;
    font-size: 0.8rem;
    font-weight: 700;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    transition: background 0.3s;
  }

  .login-btn:hover { background: var(--white); }

  .login-err { color: var(--danger); font-size: 0.8rem; margin-top: 0.8rem; letter-spacing: 0.05em; }

  .login-hint { color: var(--text-muted); font-size: 0.72rem; margin-top: 2rem; letter-spacing: 0.05em; }

  /* ===== ADMIN ===== */
  #admin-screen { display: none; }

  .admin-header {
    background: var(--bg2);
    border-bottom: 1px solid var(--border);
    padding: 1.2rem 2.5rem;
    display: flex; justify-content: space-between; align-items: center;
    position: sticky; top: 0; z-index: 50;
  }

  .admin-logo {
    font-family: 'Noto Serif TC', serif;
    font-size: 1.1rem;
    font-weight: 900;
    color: var(--white);
    letter-spacing: 0.15em;
  }

  .admin-logo em { color: var(--accent); font-style: normal; }

  .admin-logo small {
    font-family: 'Noto Sans TC', sans-serif;
    font-size: 0.7rem;
    font-weight: 300;
    color: var(--text-muted);
    letter-spacing: 0.2em;
    text-transform: uppercase;
    margin-left: 1rem;
  }

  .header-actions { display: flex; gap: 1rem; align-items: center; }

  .link-front {
    font-size: 0.78rem;
    color: var(--text-dim);
    text-decoration: none;
    letter-spacing: 0.05em;
    transition: color 0.3s;
  }

  .link-front:hover { color: var(--accent); }

  .btn-logout {
    padding: 0.5rem 1.2rem;
    background: none;
    border: 1px solid var(--border);
    color: var(--text-muted);
    cursor: pointer;
    font-size: 0.75rem;
    font-family: 'Noto Sans TC', sans-serif;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    transition: all 0.3s;
  }

  .btn-logout:hover { border-color: var(--danger); color: var(--danger); }

  .admin-main { max-width: 1100px; margin: 2.5rem auto; padding: 0 2.5rem; }

  /* STATS */
  .stats-row {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 1px;
    background: var(--border);
    border: 1px solid var(--border);
    margin-bottom: 2.5rem;
  }

  .stat-box {
    background: var(--bg2);
    padding: 1.5rem 2rem;
    border-left: 3px solid transparent;
    transition: border-color 0.3s;
  }

  .stat-box:hover { border-left-color: var(--accent); }

  .stat-box .num {
    font-family: 'Noto Serif TC', serif;
    font-size: 2.5rem;
    font-weight: 900;
    color: var(--accent);
    line-height: 1;
  }

  .stat-box .lbl {
    font-size: 0.75rem;
    color: var(--text-muted);
    letter-spacing: 0.1em;
    margin-top: 0.4rem;
    text-transform: uppercase;
  }

  /* TABS */
  .tabs {
    display: flex;
    border-bottom: 1px solid var(--border);
    margin-bottom: 2rem;
  }

  .tab {
    padding: 0.8rem 2rem;
    cursor: pointer;
    font-size: 0.8rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--text-muted);
    border-bottom: 1px solid transparent;
    margin-bottom: -1px;
    transition: all 0.3s;
  }

  .tab.active { color: var(--accent); border-bottom-color: var(--accent); }
  .tab:hover { color: var(--text); }

  .tab-panel { display: none; }
  .tab-panel.active { display: block; }

  /* FORM CARD */
  .card {
    background: var(--bg2);
    border: 1px solid var(--border);
    margin-bottom: 1.5rem;
  }

  .card-header {
    padding: 1.2rem 2rem;
    border-bottom: 1px solid var(--border);
    display: flex; justify-content: space-between; align-items: center;
  }

  .card-title {
    font-family: 'Noto Serif TC', serif;
    font-size: 1rem;
    font-weight: 700;
    color: var(--white);
    letter-spacing: 0.05em;
  }

  .card-body { padding: 2rem; }

  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }

  .form-group { margin-bottom: 1rem; }

  .form-group label {
    display: block;
    font-size: 0.7rem;
    color: var(--text-muted);
    letter-spacing: 0.15em;
    text-transform: uppercase;
    margin-bottom: 0.5rem;
  }

  .req { color: var(--accent); }

  .form-ctrl {
    width: 100%; padding: 0.75rem 1rem;
    background: var(--bg3);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: 'Noto Sans TC', sans-serif;
    font-size: 0.88rem;
    outline: none;
    transition: border-color 0.3s;
  }

  .form-ctrl:focus { border-color: var(--accent); }
  .form-ctrl option { background: var(--bg3); }
  textarea.form-ctrl { resize: vertical; min-height: 100px; }

  .form-actions {
    display: flex; align-items: center; gap: 1rem;
    padding-top: 1rem;
    border-top: 1px solid var(--border);
    margin-top: 0.5rem;
  }

  .btn-save {
    padding: 0.85rem 2rem;
    background: var(--accent);
    color: var(--bg);
    border: none; cursor: pointer;
    font-family: 'Noto Sans TC', sans-serif;
    font-size: 0.8rem;
    font-weight: 700;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    transition: background 0.3s;
  }

  .btn-save:hover { background: var(--white); }

  .btn-cancel-form {
    padding: 0.85rem 1.5rem;
    background: none;
    border: 1px solid var(--border);
    color: var(--text-muted);
    cursor: pointer;
    font-family: 'Noto Sans TC', sans-serif;
    font-size: 0.8rem;
    letter-spacing: 0.1em;
    transition: all 0.3s;
  }

  .btn-cancel-form:hover { border-color: var(--danger); color: var(--danger); }

  .save-msg { font-size: 0.82rem; }
  .save-msg.ok { color: var(--success); }
  .save-msg.err { color: var(--danger); }

  /* BTN ADD */
  .btn-add {
    display: inline-flex; align-items: center; gap: 0.5rem;
    padding: 0.8rem 1.8rem;
    background: var(--accent);
    color: var(--bg);
    border: none; cursor: pointer;
    font-family: 'Noto Sans TC', sans-serif;
    font-size: 0.8rem;
    font-weight: 700;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    margin-bottom: 1.5rem;
    transition: background 0.3s;
  }

  .btn-add:hover { background: var(--white); }

  /* TABLE */
  table { width: 100%; border-collapse: collapse; }

  thead th {
    padding: 0.9rem 1.2rem;
    text-align: left;
    font-size: 0.65rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--text-muted);
    border-bottom: 1px solid var(--border);
    background: var(--bg3);
  }

  tbody td {
    padding: 1rem 1.2rem;
    border-bottom: 1px solid var(--border);
    font-size: 0.88rem;
    vertical-align: middle;
  }

  tbody tr:last-child td { border-bottom: none; }
  tbody tr:hover td { background: rgba(255,255,255,0.02); }

  .badge {
    display: inline-block;
    padding: 0.2rem 0.6rem;
    font-size: 0.65rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    border: 1px solid currentColor;
  }

  .badge-easy { color: var(--success); }
  .badge-medium { color: var(--accent); }
  .badge-hard { color: var(--danger); }

  .btn-edit, .btn-del {
    padding: 0.3rem 0.8rem;
    border: 1px solid;
    cursor: pointer;
    font-family: 'Noto Sans TC', sans-serif;
    font-size: 0.72rem;
    letter-spacing: 0.05em;
    margin-right: 0.4rem;
    background: none;
    transition: all 0.3s;
  }

  .btn-edit { border-color: var(--border); color: var(--text-dim); }
  .btn-edit:hover { border-color: var(--accent); color: var(--accent); }
  .btn-del { border-color: var(--border); color: var(--text-dim); }
  .btn-del:hover { border-color: var(--danger); color: var(--danger); }

  .empty-td { text-align: center; padding: 4rem !important; color: var(--text-muted); font-size: 0.85rem; }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 768px) {
    .form-row { grid-template-columns: 1fr; }
    .admin-main { padding: 0 1rem; }
    .stats-row { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-box">
    <div class="login-logo">KineticPath</div>
    <p class="login-sub">Admin Dashboard</p>
    <input class="login-input" type="password" id="pwd" placeholder="● ● ● ● ● ● ● ●" onkeydown="if(event.key==='Enter')login()">
    <button class="login-btn" onclick="login()">進入後台</button>
    <p class="login-err" id="login-err"></p>
    <p class="login-hint">預設密碼：mountain2025</p>
  </div>
</div>

<!-- ADMIN -->
<div id="admin-screen">
  <div class="admin-header">
    <div class="admin-logo">KineticPath<small>後台管理</small></div>
    <div class="header-actions">
      <a class="link-front" href="index.html" target="_blank">↗ 前台預覽</a>
      <button class="btn-logout" onclick="logout()">登出</button>
    </div>
  </div>

  <div class="admin-main">
    <div class="stats-row" id="stats-row"></div>

    <div class="tabs">
      <div class="tab active" onclick="switchTab('trips',this)">行程管理</div>
      <div class="tab" onclick="switchTab('regs',this)">報名紀錄</div>
    </div>

    <!-- TRIPS -->
    <div class="tab-panel active" id="tab-trips">
      <button class="btn-add" onclick="showForm()">＋ 新增行程</button>

      <div class="card" id="form-card" style="display:none;">
        <div class="card-header">
          <span class="card-title" id="form-title">新增行程</span>
        </div>
        <div class="card-body">
          <input type="hidden" id="edit-id">
          <div class="form-row">
            <div class="form-group">
              <label>行程名稱 <span class="req">*</span></label>
              <input class="form-ctrl" id="f-name" type="text" placeholder="例：玉山主峰三天兩夜">
            </div>
            <div class="form-group">
              <label>地區</label>
              <input class="form-ctrl" id="f-area" type="text" placeholder="例：南投、花蓮">
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label>出發日期 <span class="req">*</span></label>
              <input class="form-ctrl" id="f-date" type="date">
            </div>
            <div class="form-group">
              <label>天數</label>
              <input class="form-ctrl" id="f-days" type="number" min="1" placeholder="幾天">
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label>費用 NT$ <span class="req">*</span></label>
              <input class="form-ctrl" id="f-price" type="number" min="0" placeholder="每人費用">
            </div>
            <div class="form-group">
              <label>名額上限</label>
              <input class="form-ctrl" id="f-slots" type="number" min="1" placeholder="人數">
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label>難度</label>
              <select class="form-ctrl" id="f-diff">
                <option value="easy">輕鬆</option>
                <option value="medium" selected>中級</option>
                <option value="hard">進階</option>
              </select>
            </div>
            <div class="form-group">
              <label>集合地點</label>
              <input class="form-ctrl" id="f-meet" type="text" placeholder="例：台北車站北三門">
            </div>
          </div>
          <div class="form-group">
            <label>封面圖片網址（選填）</label>
            <input class="form-ctrl" id="f-img" type="url" placeholder="https://...">
          </div>
          <div class="form-group">
            <label>行程介紹</label>
            <textarea class="form-ctrl" id="f-desc" placeholder="詳細介紹、注意事項、費用包含等…"></textarea>
          </div>
          <div class="form-actions">
            <button class="btn-cancel-form" onclick="hideForm()">取消</button>
            <button class="btn-save" onclick="saveTrip()">儲存行程</button>
            <span class="save-msg" id="save-msg"></span>
          </div>
        </div>
      </div>

      <div class="card" style="padding:0; overflow:hidden;">
        <table>
          <thead>
            <tr>
              <th>行程名稱</th>
              <th>地區</th>
              <th>出發日期</th>
              <th>難度</th>
              <th>費用</th>
              <th>名額</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody id="trips-tbody"></tbody>
        </table>
      </div>
    </div>

    <!-- REGS -->
    <div class="tab-panel" id="tab-regs">
      <div class="card" style="padding:0; overflow:hidden;">
        <table>
          <thead>
            <tr>
              <th>行程</th>
              <th>姓名</th>
              <th>電話</th>
              <th>Email</th>
              <th>人數</th>
              <th>時間</th>
              <th>備註</th>
            </tr>
          </thead>
          <tbody id="regs-tbody"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<script>
const PWD = 'mountain2025';

function login() {
  if (document.getElementById('pwd').value === PWD) {
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('admin-screen').style.display = 'block';
    renderAll();
  } else {
    document.getElementById('login-err').textContent = '密碼錯誤，請再試一次。';
  }
}

function logout() {
  document.getElementById('login-screen').style.display = 'flex';
  document.getElementById('admin-screen').style.display = 'none';
  document.getElementById('pwd').value = '';
}

function getTrips() { try { return JSON.parse(localStorage.getItem('mountain_trips') || '[]'); } catch { return []; } }
function saveTrips(a) { localStorage.setItem('mountain_trips', JSON.stringify(a)); }
function getRegs()  { try { return JSON.parse(localStorage.getItem('mountain_registrations') || '[]'); } catch { return []; } }
function nextId(a)  { return a.length ? Math.max(...a.map(x => x.id)) + 1 : 1; }

function switchTab(name, el) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('tab-' + name).classList.add('active');
  if (name === 'regs') renderRegs();
}

function renderStats() {
  const trips = getTrips(), regs = getRegs();
  document.getElementById('stats-row').innerHTML = `
    <div class="stat-box"><div class="num">${trips.length}</div><div class="lbl">行程總數</div></div>
    <div class="stat-box"><div class="num">${regs.length}</div><div class="lbl">報名總數</div></div>
    <div class="stat-box"><div class="num">${regs.reduce((s,r)=>s+Number(r.count||1),0)}</div><div class="lbl">報名人次</div></div>
  `;
}

function renderTripsTable() {
  const trips = getTrips();
  const diffMap = { easy: 'badge-easy', medium: 'badge-medium', hard: 'badge-hard' };
  const diffLabel = { easy: '輕鬆', medium: '中級', hard: '進階' };
  const tbody = document.getElementById('trips-tbody');

  if (!trips.length) {
    tbody.innerHTML = '<tr><td class="empty-td" colspan="7">尚無行程，點上方「新增行程」開始吧。</td></tr>';
    return;
  }

  tbody.innerHTML = trips.map(t => `
    <tr>
      <td><strong>${t.name}</strong></td>
      <td>${t.area || '—'}</td>
      <td>${t.date || '—'}</td>
      <td><span class="badge ${diffMap[t.difficulty]||'badge-medium'}">${diffLabel[t.difficulty]||'中級'}</span></td>
      <td>NT$ ${Number(t.price||0).toLocaleString()}</td>
      <td>${t.slots || '—'}</td>
      <td>
        <button class="btn-edit" onclick="editTrip(${t.id})">編輯</button>
        <button class="btn-del" onclick="delTrip(${t.id})">刪除</button>
      </td>
    </tr>
  `).join('');
}

function renderRegs() {
  const regs = getRegs(), trips = getTrips();
  const tbody = document.getElementById('regs-tbody');

  if (!regs.length) {
    tbody.innerHTML = '<tr><td class="empty-td" colspan="7">尚無報名紀錄。</td></tr>';
    return;
  }

  tbody.innerHTML = [...regs].reverse().map(r => {
    const trip = trips.find(t => t.id === r.tripId);
    return `<tr>
      <td><strong>${trip ? trip.name : '—'}</strong></td>
      <td>${r.name}</td>
      <td>${r.phone}</td>
      <td>${r.email}</td>
      <td>${r.count || 1}</td>
      <td style="font-size:0.75rem;color:var(--text-muted)">${r.time ? new Date(r.time).toLocaleString('zh-TW') : '—'}</td>
      <td style="font-size:0.8rem">${r.note || '—'}</td>
    </tr>`;
  }).join('');
}

function showForm() {
  document.getElementById('form-title').textContent = '新增行程';
  clearForm();
  document.getElementById('form-card').style.display = 'block';
  document.getElementById('form-card').scrollIntoView({ behavior: 'smooth' });
}

function hideForm() {
  document.getElementById('form-card').style.display = 'none';
  clearForm();
}

function clearForm() {
  ['f-name','f-area','f-date','f-days','f-price','f-slots','f-meet','f-img','f-desc'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('f-diff').value = 'medium';
  document.getElementById('edit-id').value = '';
  document.getElementById('save-msg').textContent = '';
}

function editTrip(id) {
  const t = getTrips().find(x => x.id === id);
  if (!t) return;
  document.getElementById('form-title').textContent = '編輯行程';
  document.getElementById('edit-id').value = id;
  document.getElementById('f-name').value  = t.name || '';
  document.getElementById('f-area').value  = t.area || '';
  document.getElementById('f-date').value  = t.date || '';
  document.getElementById('f-days').value  = t.days || '';
  document.getElementById('f-price').value = t.price || '';
  document.getElementById('f-slots').value = t.slots || '';
  document.getElementById('f-diff').value  = t.difficulty || 'medium';
  document.getElementById('f-meet').value  = t.meetingPoint || '';
  document.getElementById('f-img').value   = t.imageUrl || '';
  document.getElementById('f-desc').value  = t.description || '';
  document.getElementById('form-card').style.display = 'block';
  document.getElementById('form-card').scrollIntoView({ behavior: 'smooth' });
}

function saveTrip() {
  const name  = document.getElementById('f-name').value.trim();
  const date  = document.getElementById('f-date').value;
  const price = document.getElementById('f-price').value;
  const msg   = document.getElementById('save-msg');

  if (!name)  { msg.className='save-msg err'; msg.textContent='請填寫行程名稱。'; return; }
  if (!date)  { msg.className='save-msg err'; msg.textContent='請選擇出發日期。'; return; }
  if (!price) { msg.className='save-msg err'; msg.textContent='請填寫費用。'; return; }

  const trips  = getTrips();
  const editId = document.getElementById('edit-id').value;

  const trip = {
    id: editId ? Number(editId) : nextId(trips),
    name,
    area: document.getElementById('f-area').value.trim(),
    date,
    days: document.getElementById('f-days').value,
    price: Number(price),
    slots: document.getElementById('f-slots').value,
    difficulty: document.getElementById('f-diff').value,
    meetingPoint: document.getElementById('f-meet').value.trim(),
    imageUrl: document.getElementById('f-img').value.trim(),
    description: document.getElementById('f-desc').value.trim(),
    createdAt: editId ? trips.find(t=>t.id===Number(editId))?.createdAt : new Date().toISOString(),
  };

  if (editId) {
    const idx = trips.findIndex(t => t.id === Number(editId));
    if (idx !== -1) trips[idx] = trip; else trips.push(trip);
  } else {
    trips.push(trip);
  }

  saveTrips(trips);
  renderAll();
  hideForm();
  msg.className = 'save-msg ok'; msg.textContent = '✓ 儲存成功';
  setTimeout(() => { msg.textContent = ''; }, 3000);
}

function delTrip(id) {
  if (!confirm('確定要刪除這個行程嗎？')) return;
  saveTrips(getTrips().filter(t => t.id !== id));
  renderAll();
}

function renderAll() { renderStats(); renderTripsTable(); }

document.getElementById('pwd').addEventListener('keydown', e => { if (e.key === 'Enter') login(); });
</script>
</body>
</html>
