<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KineticPath | 後台管理</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@700;900&family=Noto+Sans+TC:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0a0a;--bg2:#111;--bg3:#181818;--border:rgba(255,255,255,0.08);--text:#e8e8e8;--dim:#888;--muted:#444;--accent:#c8a96e;--white:#fff;--danger:#c05050;--success:#5a9a52}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Noto Sans TC',sans-serif;background:var(--bg);color:var(--text)}

/* LOGIN */
#login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(to bottom,rgba(10,10,10,0.96),rgba(10,10,10,0.99)),url('https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?w=1200&q=60') center/cover}
.login-box{width:380px;text-align:center;animation:fadeUp 0.5s ease both}
.login-logo{font-family:'Noto Serif TC',serif;font-size:2rem;font-weight:900;color:var(--white);letter-spacing:0.15em;margin-bottom:0.3rem}
.login-logo em{color:var(--accent);font-style:normal}
.login-sub{color:var(--muted);font-size:0.75rem;letter-spacing:0.3em;text-transform:uppercase;margin-bottom:2.5rem}
.login-input{width:100%;padding:1rem 1.2rem;background:var(--bg2);border:1px solid var(--border);color:var(--text);font-family:'Noto Sans TC',sans-serif;font-size:0.95rem;margin-bottom:0.8rem;outline:none;text-align:center;letter-spacing:0.15em;transition:border-color 0.3s}
.login-input:focus{border-color:var(--accent)}
.login-btn{width:100%;padding:1rem;background:var(--accent);color:var(--bg);border:none;cursor:pointer;font-family:'Noto Sans TC',sans-serif;font-size:0.8rem;font-weight:700;letter-spacing:0.25em;text-transform:uppercase;transition:background 0.3s}
.login-btn:hover{background:var(--white)}
.login-err{color:var(--danger);font-size:0.8rem;margin-top:0.8rem}
.login-hint{color:var(--muted);font-size:0.72rem;margin-top:2rem}

/* ADMIN */
#admin-screen{display:none}
.admin-header{background:var(--bg2);border-bottom:1px solid var(--border);padding:1.2rem 2.5rem;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:50}
.admin-logo{font-family:'Noto Serif TC',serif;font-size:1.1rem;font-weight:900;color:var(--white);letter-spacing:0.15em}
.admin-logo em{color:var(--accent);font-style:normal}
.admin-logo small{font-family:'Noto Sans TC',sans-serif;font-size:0.7rem;font-weight:300;color:var(--muted);letter-spacing:0.2em;text-transform:uppercase;margin-left:1rem}
.header-actions{display:flex;gap:1rem;align-items:center}
.link-front{font-size:0.78rem;color:var(--dim);text-decoration:none;transition:color 0.3s}
.link-front:hover{color:var(--accent)}
.btn-logout{padding:0.5rem 1.2rem;background:none;border:1px solid var(--border);color:var(--muted);cursor:pointer;font-family:'Noto Sans TC',sans-serif;font-size:0.75rem;letter-spacing:0.1em;text-transform:uppercase;transition:all 0.3s}
.btn-logout:hover{border-color:var(--danger);color:var(--danger)}

.admin-main{max-width:1200px;margin:2.5rem auto;padding:0 2.5rem}

/* TABS */
.tabs{display:flex;border-bottom:1px solid var(--border);margin-bottom:2rem}
.tab{padding:0.8rem 2rem;cursor:pointer;font-size:0.8rem;letter-spacing:0.15em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid transparent;margin-bottom:-1px;transition:all 0.3s}
.tab.active{color:var(--accent);border-bottom-color:var(--accent)}
.tab:hover{color:var(--text)}
.tab-panel{display:none}
.tab-panel.active{display:block}

/* CARD */
.card{background:var(--bg2);border:1px solid var(--border);margin-bottom:1.5rem}
.card-header{padding:1.2rem 2rem;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.card-title{font-family:'Noto Serif TC',serif;font-size:1rem;font-weight:700;color:var(--white);letter-spacing:0.05em}
.card-body{padding:2rem}

/* FORM */
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
.form-row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:1rem}
.form-group{margin-bottom:1rem}
.form-group label{display:block;font-size:0.7rem;color:var(--muted);letter-spacing:0.15em;text-transform:uppercase;margin-bottom:0.5rem}
.req{color:var(--accent)}
.form-ctrl{width:100%;padding:0.75rem 1rem;background:var(--bg3);border:1px solid var(--border);color:var(--text);font-family:'Noto Sans TC',sans-serif;font-size:0.88rem;outline:none;transition:border-color 0.3s}
.form-ctrl:focus{border-color:var(--accent)}
.form-ctrl option{background:var(--bg3)}
textarea.form-ctrl{resize:vertical;min-height:80px}
.form-actions{display:flex;align-items:center;gap:1rem;padding-top:1rem;border-top:1px solid var(--border);margin-top:0.5rem}
.btn-save{padding:0.85rem 2rem;background:var(--accent);color:var(--bg);border:none;cursor:pointer;font-family:'Noto Sans TC',sans-serif;font-size:0.8rem;font-weight:700;letter-spacing:0.15em;text-transform:uppercase;transition:background 0.3s}
.btn-save:hover{background:var(--white)}
.btn-cancel-form{padding:0.85rem 1.5rem;background:none;border:1px solid var(--border);color:var(--muted);cursor:pointer;font-family:'Noto Sans TC',sans-serif;font-size:0.8rem;letter-spacing:0.1em;transition:all 0.3s}
.btn-cancel-form:hover{border-color:var(--danger);color:var(--danger)}
.save-msg{font-size:0.82rem}
.save-msg.ok{color:var(--success)}
.save-msg.err{color:var(--danger)}

/* BUTTONS */
.btn-add{display:inline-flex;align-items:center;gap:0.5rem;padding:0.8rem 1.8rem;background:var(--accent);color:var(--bg);border:none;cursor:pointer;font-family:'Noto Sans TC',sans-serif;font-size:0.8rem;font-weight:700;letter-spacing:0.15em;text-transform:uppercase;margin-bottom:1.5rem;transition:background 0.3s}
.btn-add:hover{background:var(--white)}
.btn-export{display:inline-flex;align-items:center;gap:0.5rem;padding:0.6rem 1.2rem;background:none;border:1px solid var(--success);color:var(--success);cursor:pointer;font-family:'Noto Sans TC',sans-serif;font-size:0.78rem;letter-spacing:0.1em;transition:all 0.3s;margin-bottom:1.5rem;margin-left:1rem}
.btn-export:hover{background:var(--success);color:var(--bg)}
.btn-back{display:inline-flex;align-items:center;gap:0.5rem;padding:0.6rem 1.2rem;background:none;border:1px solid var(--border);color:var(--dim);cursor:pointer;font-family:'Noto Sans TC',sans-serif;font-size:0.78rem;letter-spacing:0.1em;transition:all 0.3s;margin-bottom:1.5rem}
.btn-back:hover{border-color:var(--accent);color:var(--accent)}

/* TABLE */
table{width:100%;border-collapse:collapse}
thead th{padding:0.9rem 1.2rem;text-align:left;font-size:0.65rem;letter-spacing:0.2em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--border);background:var(--bg3)}
tbody td{padding:1rem 1.2rem;border-bottom:1px solid var(--border);font-size:0.88rem;vertical-align:middle}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover td{background:rgba(255,255,255,0.02)}
.badge{display:inline-block;padding:0.2rem 0.6rem;font-size:0.65rem;letter-spacing:0.1em;text-transform:uppercase;border:1px solid currentColor}
.badge-easy{color:var(--success)}.badge-medium{color:var(--accent)}.badge-hard{color:var(--danger)}
.btn-sm{padding:0.3rem 0.8rem;border:1px solid;cursor:pointer;font-family:'Noto Sans TC',sans-serif;font-size:0.72rem;margin-right:0.4rem;background:none;transition:all 0.3s}
.btn-view{border-color:var(--border);color:var(--dim)}.btn-view:hover{border-color:var(--accent);color:var(--accent)}
.btn-edit{border-color:var(--border);color:var(--dim)}.btn-edit:hover{border-color:var(--accent);color:var(--accent)}
.btn-del{border-color:var(--border);color:var(--dim)}.btn-del:hover{border-color:var(--danger);color:var(--danger)}
.empty-td{text-align:center;padding:4rem!important;color:var(--muted);font-size:0.85rem}
.reg-count-badge{display:inline-block;background:var(--accent);color:var(--bg);font-size:0.72rem;font-weight:700;padding:0.15rem 0.5rem;border-radius:2px;margin-left:0.5rem}

/* TRIP DETAIL VIEW */
#trip-detail-view{display:none}
.detail-header{margin-bottom:1.5rem}
.detail-title{font-family:'Noto Serif TC',serif;font-size:1.3rem;font-weight:900;color:var(--white)}
.detail-sub{font-size:0.82rem;color:var(--muted);margin-top:0.3rem}

/* MODAL */
.modal-overlay{display:none;position:fixed;inset:0;z-index:200;background:rgba(0,0,0,0.85);backdrop-filter:blur(6px);align-items:center;justify-content:center;padding:2rem}
.modal-overlay.open{display:flex}
.modal-box{background:var(--bg2);border:1px solid var(--border);max-width:500px;width:100%;max-height:80vh;overflow-y:auto;padding:2rem;position:relative;animation:fadeUp 0.3s ease both}
.modal-close{position:absolute;top:1rem;right:1rem;background:none;border:1px solid var(--border);color:var(--dim);width:32px;height:32px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:0.85rem;transition:all 0.3s}
.modal-close:hover{border-color:var(--danger);color:var(--danger)}
.modal-title{font-family:'Noto Serif TC',serif;font-size:1.1rem;font-weight:700;color:var(--white);margin-bottom:1.5rem}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:0.5rem 1rem}
.info-item label{display:block;font-size:0.65rem;color:var(--muted);letter-spacing:0.1em;text-transform:uppercase;margin-bottom:0.2rem}
.info-item span{font-size:0.88rem;color:var(--text)}

@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:768px){.form-row,.form-row3{grid-template-columns:1fr}.admin-main{padding:0 1rem}.info-grid{grid-template-columns:1fr}}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-box">
    <div class="login-logo">Kinetic<em>Path</em></div>
    <p class="login-sub">Admin Dashboard</p>
    <input class="login-input" type="password" id="pwd" placeholder="● ● ● ● ● ● ● ●" onkeydown="if(event.key==='Enter')login()">
    <button class="login-btn" onclick="login()">進入後台</button>
    <p class="login-err" id="login-err"></p>
    <p class="login-hint">預設密碼：admin</p>
  </div>
</div>

<!-- ADMIN -->
<div id="admin-screen">
  <div class="admin-header">
    <div class="admin-logo">Kinetic<em>Path</em><small>後台管理</small></div>
    <div class="header-actions">
      <a class="link-front" href="index.html" target="_blank">↗ 前台預覽</a>
      <button class="btn-logout" onclick="logout()">登出</button>
    </div>
  </div>

  <div class="admin-main">
    <div class="tabs">
      <div class="tab active" onclick="switchTab('trips',this)">行程管理</div>
      <div class="tab" onclick="switchTab('regs',this)">所有報名紀錄</div>
    </div>

    <!-- 行程管理 TAB -->
    <div class="tab-panel active" id="tab-trips">

      <!-- 行程列表 -->
      <div id="trips-list-view">
        <button class="btn-add" onclick="showForm()">＋ 新增行程</button>

        <!-- 新增/編輯表單 -->
        <div class="card" id="form-card" style="display:none;">
          <div class="card-header">
            <span class="card-title" id="form-title">新增行程</span>
          </div>
          <div class="card-body">
            <input type="hidden" id="edit-id">
            <div class="form-row">
              <div class="form-group">
                <label>行程名稱 <span class="req">*</span></label>
                <input class="form-ctrl" id="f-name" type="text" placeholder="例：玉山主峰三天兩夜">
              </div>
              <div class="form-group">
                <label>地區</label>
                <input class="form-ctrl" id="f-area" type="text" placeholder="例：南投、花蓮">
              </div>
            </div>
            <div class="form-row">
              <div class="form-group">
                <label>出發日期 <span class="req">*</span></label>
                <input class="form-ctrl" id="f-date" type="date">
              </div>
              <div class="form-group">
                <label>天數</label>
                <input class="form-ctrl" id="f-days" type="number" min="1" placeholder="幾天">
              </div>
            </div>
            <div class="form-row">
              <div class="form-group">
                <label>費用 NT$（選填）</label>
                <input class="form-ctrl" id="f-price" type="number" min="0" placeholder="每人費用">
              </div>
              <div class="form-group">
                <label>名額上限</label>
                <input class="form-ctrl" id="f-slots" type="number" min="1" placeholder="人數">
              </div>
            </div>
            <div class="form-row">
              <div class="form-group">
                <label>難度</label>
                <select class="form-ctrl" id="f-diff">
                  <option value="easy">輕鬆</option>
                  <option value="medium" selected>中級</option>
                  <option value="hard">進階</option>
                </select>
              </div>
              <div class="form-group">
                <label>集合地點</label>
                <input class="form-ctrl" id="f-meet" type="text" placeholder="例：台北車站北三門">
              </div>
            </div>
            <div class="form-group">
              <label>封面圖片網址（選填）</label>
              <input class="form-ctrl" id="f-img" type="url" placeholder="https://...">
            </div>
            <div class="form-group">
              <label>行程介紹</label>
              <textarea class="form-ctrl" id="f-desc" placeholder="詳細介紹、注意事項、費用包含等…"></textarea>
            </div>
            <div class="form-actions">
              <button class="btn-cancel-form" onclick="hideForm()">取消</button>
              <button class="btn-save" onclick="saveTrip()">儲存行程</button>
              <span class="save-msg" id="save-msg"></span>
            </div>
          </div>
        </div>

        <!-- 行程列表表格 -->
        <div class="card" style="padding:0;overflow:hidden;">
          <table>
            <thead>
              <tr>
                <th>行程名稱</th>
                <th>地區</th>
                <th>出發日期</th>
                <th>難度</th>
                <th>費用</th>
                <th>名額</th>
                <th>報名人數</th>
                <th>操作</th>
              </tr>
            </thead>
            <tbody id="trips-tbody"></tbody>
          </table>
        </div>
      </div>

      <!-- 行程報名詳情 -->
      <div id="trip-detail-view">
        <button class="btn-back" onclick="backToTrips()">← 返回行程列表</button>
        <button class="btn-export" onclick="exportExcel()">⬇ 匯出 Excel</button>
        <div class="detail-header">
          <div class="detail-title" id="detail-trip-name"></div>
          <div class="detail-sub" id="detail-trip-info"></div>
        </div>
        <div class="card" style="padding:0;overflow:hidden;">
          <table id="detail-table">
            <thead>
              <tr>
                <th>#</th>
                <th>姓名</th>
                <th>性別</th>
                <th>出生日期</th>
                <th>國家</th>
                <th>身分證/護照</th>
                <th>電話</th>
                <th>Email</th>
                <th>地址</th>
                <th>緊急聯絡人</th>
                <th>緊急電話</th>
                <th>備註</th>
                <th>報名時間</th>
              </tr>
            </thead>
            <tbody id="detail-tbody"></tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- 所有報名紀錄 TAB -->
    <div class="tab-panel" id="tab-regs">
      <button class="btn-export" onclick="exportAllExcel()" style="margin-bottom:1.5rem">⬇ 匯出全部 Excel</button>
      <div class="card" style="padding:0;overflow:hidden;">
        <table>
          <thead>
            <tr>
              <th>行程</th>
              <th>姓名</th>
              <th>性別</th>
              <th>電話</th>
              <th>Email</th>
              <th>國家</th>
              <th>緊急聯絡人</th>
              <th>備註</th>
              <th>報名時間</th>
            </tr>
          </thead>
          <tbody id="regs-tbody"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<!-- 報名詳情 Modal -->
<div class="modal-overlay" id="regModal">
  <div class="modal-box">
    <button class="modal-close" onclick="closeRegModal()">✕</button>
    <div class="modal-title" id="reg-modal-title">報名詳情</div>
    <div class="info-grid" id="reg-modal-content"></div>
  </div>
</div>

<script>
const PWD = 'admin';
let currentTripId = null;

function login() {
  if (document.getElementById('pwd').value === PWD) {
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('admin-screen').style.display = 'block';
    renderTripsTable();
  } else {
    document.getElementById('login-err').textContent = '密碼錯誤，請再試一次。';
  }
}

function logout() {
  document.getElementById('login-screen').style.display = 'flex';
  document.getElementById('admin-screen').style.display = 'none';
  document.getElementById('pwd').value = '';
}

function getTrips() { try { return JSON.parse(localStorage.getItem('mountain_trips') || '[]'); } catch { return []; } }
function saveTrips(a) { localStorage.setItem('mountain_trips', JSON.stringify(a)); }
function getRegs()  { try { return JSON.parse(localStorage.getItem('mountain_registrations') || '[]'); } catch { return []; } }
function nextId(a)  { return a.length ? Math.max(...a.map(x => x.id)) + 1 : 1; }

function switchTab(name, el) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('tab-' + name).classList.add('active');
  if (name === 'regs') renderAllRegs();
}

// 行程列表
function renderTripsTable() {
  const trips = getTrips();
  const regs  = getRegs();
  const diffMap   = { easy:'badge-easy', medium:'badge-medium', hard:'badge-hard' };
  const diffLabel = { easy:'輕鬆', medium:'中級', hard:'進階' };
  const tbody = document.getElementById('trips-tbody');
  if (!trips.length) {
    tbody.innerHTML = '<tr><td class="empty-td" colspan="8">尚無行程，點上方「新增行程」開始吧。</td></tr>';
    return;
  }
  tbody.innerHTML = trips.map(t => {
    const tripRegs = regs.filter(r => r.tripId === t.id);
    const regCount = tripRegs.length;
    const price = t.price ? `NT$ ${Number(t.price).toLocaleString()}` : '價格洽詢';
    return `<tr>
      <td><strong>${t.name}</strong></td>
      <td>${t.area || '—'}</td>
      <td>${t.date || '—'}</td>
      <td><span class="badge ${diffMap[t.difficulty]||'badge-medium'}">${diffLabel[t.difficulty]||'中級'}</span></td>
      <td>${price}</td>
      <td>${t.slots || '—'}</td>
      <td>
        ${regCount > 0
          ? `<span style="cursor:pointer;color:var(--accent);font-weight:700" onclick="viewTripRegs(${t.id})">${regCount} 人 →</span>`
          : `<span style="color:var(--muted)">0 人</span>`
        }
      </td>
      <td>
        <button class="btn-sm btn-view" onclick="viewTripRegs(${t.id})">查看報名</button>
        <button class="btn-sm btn-edit" onclick="editTrip(${t.id})">編輯</button>
        <button class="btn-sm btn-del" onclick="delTrip(${t.id})">刪除</button>
      </td>
    </tr>`;
  }).join('');
}

// 查看單一行程報名
function viewTripRegs(tripId) {
  currentTripId = tripId;
  const trip = getTrips().find(t => t.id === tripId);
  if (!trip) return;
  const regs = getRegs().filter(r => r.tripId === tripId);

  document.getElementById('trips-list-view').style.display = 'none';
  document.getElementById('trip-detail-view').style.display = 'block';
  document.getElementById('detail-trip-name').textContent = trip.name;
  document.getElementById('detail-trip-info').textContent = `${trip.date || ''} · ${trip.area || ''} · 共 ${regs.length} 人報名`;

  const tbody = document.getElementById('detail-tbody');
  if (!regs.length) {
    tbody.innerHTML = '<tr><td class="empty-td" colspan="13">此行程尚無報名紀錄。</td></tr>';
    return;
  }
  tbody.innerHTML = regs.map((r, i) => `
    <tr style="cursor:pointer" onclick="openRegModal(${JSON.stringify(r).replace(/"/g,'&quot;')})">
      <td>${i+1}</td>
      <td><strong>${r.name||'—'}</strong></td>
      <td>${r.gender||'—'}</td>
      <td>${r.birthday||'—'}</td>
      <td>${r.country||'—'}</td>
      <td>${r.idNumber||'—'}</td>
      <td>${r.phone||'—'}</td>
      <td>${r.email||'—'}</td>
      <td style="max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${r.address||'—'}</td>
      <td>${r.emergency||'—'}</td>
      <td>${r.emergencyPhone||'—'}</td>
      <td>${r.note||'—'}</td>
      <td style="font-size:0.75rem;color:var(--muted)">${r.time ? new Date(r.time).toLocaleString('zh-TW') : '—'}</td>
    </tr>
  `).join('');
}

function backToTrips() {
  currentTripId = null;
  document.getElementById('trip-detail-view').style.display = 'none';
  document.getElementById('trips-list-view').style.display = 'block';
  renderTripsTable();
}

  document.getElementById('reg-modal-content').innerHTML = `
    <div class="info-item"><label>姓名</label><span>${r.name||'—'}</span></div>
    <div class="info-item"><label>性別</label><span>${r.gender||'—'}</span></div>
    <div class="info-item"><label>出生日期</label><span>${r.birthday||'—'}</span></div>
    <div class="info-item"><label>國家</label><span>${r.country||'—'}</span></div>
    <div class="info-item"><label>身分證/護照</label><span>${r.idNumber||'—'}</span></div>

    <div class="info-item"><label>Email</label><span>${r.email||'—'}</span></div>
    <div class="info-item" style="grid-column:1/-1"><label>地址</label><span>${r.address||'—'}</span></div>
    <div class="info-item"><label>緊急聯絡人</label><span>${r.emergency||'—'}</span></div>
    <div class="info-item"><label>緊急聯絡電話</label><span>${r.emergencyPhone||'—'}</span></div>

    <div class="info-item" style="grid-column:1/-1"><label>報名時間</label><span>${r.time ? new Date(r.time).toLocaleString('zh-TW') : '—'}</span></div>

function closeRegModal() { document.getElementById('regModal').classList.remove('open'); }
document.getElementById('regModal').addEventListener('click', function(e) { if (e.target === this) closeRegModal(); });

// 所有報名紀錄
function renderAllRegs() {
  const regs  = getRegs();
  const trips = getTrips();
  const tbody = document.getElementById('regs-tbody');
  if (!regs.length) {
    tbody.innerHTML = '<tr><td class="empty-td" colspan="9">尚無報名紀錄。</td></tr>';
    return;
  }
  tbody.innerHTML = [...regs].reverse().map(r => {
    const trip = trips.find(t => t.id === r.tripId);
    return `<tr>
      <td><strong>${trip ? trip.name : '—'}</strong></td>
      <td>${r.name||'—'}</td>
      <td>${r.gender||'—'}</td>
      <td>${r.phone||'—'}</td>
      <td>${r.email||'—'}</td>
      <td>${r.country||'—'}</td>
      <td>${r.emergency||'—'} ${r.emergencyPhone ? '(' + r.emergencyPhone + ')' : ''}</td>
      <td>${r.note||'—'}</td>
      <td style="font-size:0.75rem;color:var(--muted)">${r.time ? new Date(r.time).toLocaleString('zh-TW') : '—'}</td>
    </tr>`;
  }).join('');
}

// 匯出 Excel（單一行程）
function exportExcel() {
  const trip = getTrips().find(t => t.id === currentTripId);
  const regs = getRegs().filter(r => r.tripId === currentTripId);
  if (!regs.length) { alert('此行程尚無報名資料。'); return; }
  const headers = ['姓名','性別','出生日期','國家','身分證/護照號碼','電話','Email','地址','緊急聯絡人','緊急聯絡電話','備註','報名時間'];
  const rows = regs.map(r => [
    r.name||'', r.gender||'', r.birthday||'', r.country||'', r.idNumber||'',
    r.phone||'', r.email||'', r.address||'', r.emergency||'', r.emergencyPhone||'',
    r.note||'', r.time ? new Date(r.time).toLocaleString('zh-TW') : ''
  ]);

// 匯出全部
function exportAllExcel() {
  const regs  = getRegs();
  const trips = getTrips();
  if (!regs.length) { alert('尚無報名資料。'); return; }
  const headers = ['行程名稱','姓名','性別','出生日期','國家','身分證/護照號碼','電話','Email','地址','緊急聯絡人','緊急聯絡電話','備註','報名時間'];
  const rows = regs.map(r => {
    const trip = trips.find(t => t.id === r.tripId);
    return [
      trip?.name||'', r.name||'', r.gender||'', r.birthday||'', r.country||'', r.idNumber||'',
      r.phone||'', r.email||'', r.address||'', r.emergency||'', r.emergencyPhone||'',
      r.note||'', r.time ? new Date(r.time).toLocaleString('zh-TW') : ''
    ];
  });
  downloadCSV('KineticPath_全部報名名單', headers, rows);
}

function downloadCSV(filename, headers, rows) {
  const BOM = '\uFEFF';
  const csv = BOM + [headers, ...rows].map(r => r.map(v => `"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href = url; a.download = filename + '.csv';
  a.click(); URL.revokeObjectURL(url);
}

// 行程表單
function showForm() {
  document.getElementById('form-title').textContent = '新增行程';
  clearForm();
  document.getElementById('form-card').style.display = 'block';
  document.getElementById('form-card').scrollIntoView({ behavior: 'smooth' });
}

function hideForm() {
  document.getElementById('form-card').style.display = 'none';
  clearForm();
}

function clearForm() {
  ['f-name','f-area','f-date','f-days','f-price','f-slots','f-meet','f-img','f-desc'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('f-diff').value = 'medium';
  document.getElementById('edit-id').value = '';
  document.getElementById('save-msg').textContent = '';
}

function editTrip(id) {
  const t = getTrips().find(x => x.id === id);
  if (!t) return;
  document.getElementById('form-title').textContent = '編輯行程';
  document.getElementById('edit-id').value  = id;
  document.getElementById('f-name').value   = t.name || '';
  document.getElementById('f-area').value   = t.area || '';
  document.getElementById('f-date').value   = t.date || '';
  document.getElementById('f-days').value   = t.days || '';
  document.getElementById('f-price').value  = t.price || '';
  document.getElementById('f-slots').value  = t.slots || '';
  document.getElementById('f-diff').value   = t.difficulty || 'medium';
  document.getElementById('f-meet').value   = t.meetingPoint || '';
  document.getElementById('f-img').value    = t.imageUrl || '';
  document.getElementById('f-desc').value   = t.description || '';
  document.getElementById('form-card').style.display = 'block';
  document.getElementById('form-card').scrollIntoView({ behavior: 'smooth' });
}

function saveTrip() {
  const name = document.getElementById('f-name').value.trim();
  const date = document.getElementById('f-date').value;
  const msg  = document.getElementById('save-msg');
  if (!name) { msg.className='save-msg err'; msg.textContent='請填寫行程名稱。'; return; }
  if (!date) { msg.className='save-msg err'; msg.textContent='請選擇出發日期。'; return; }
  const trips  = getTrips();
  const editId = document.getElementById('edit-id').value;
  const trip = {
    id: editId ? Number(editId) : nextId(trips),
    name, area: document.getElementById('f-area').value.trim(), date,
    days: document.getElementById('f-days').value,
    price: document.getElementById('f-price').value ? Number(document.getElementById('f-price').value) : '',
    slots: document.getElementById('f-slots').value,
    difficulty: document.getElementById('f-diff').value,
    meetingPoint: document.getElementById('f-meet').value.trim(),
    imageUrl: document.getElementById('f-img').value.trim(),
    description: document.getElementById('f-desc').value.trim(),
    createdAt: editId ? trips.find(t=>t.id===Number(editId))?.createdAt : new Date().toISOString(),
  };
  if (editId) { const idx = trips.findIndex(t=>t.id===Number(editId)); if(idx!==-1) trips[idx]=trip; else trips.push(trip); }
  else trips.push(trip);
  saveTrips(trips);
  renderTripsTable();
  hideForm();
  msg.className='save-msg ok'; msg.textContent='✓ 儲存成功';
  setTimeout(()=>{msg.textContent=''},3000);
}

function delTrip(id) {
  if (!confirm('確定要刪除這個行程嗎？')) return;
  saveTrips(getTrips().filter(t=>t.id!==id));
  renderTripsTable();
}

document.getElementById('pwd').addEventListener('keydown', e => { if (e.key==='Enter') login(); });
